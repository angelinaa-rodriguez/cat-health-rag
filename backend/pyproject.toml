[project]
name = "petmed-rag"
version = "0.1.0"
description = "Evidence-based RAG for cat health questions (with citations + safety guardrails)."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",

  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "readability-lxml>=0.8.1",
  "openai>=1.40.0",
  "chromadb>=0.5.5",

]

[project.scripts]
petmed-rag = "petmed_rag.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
